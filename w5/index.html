<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端心電感應 (多人默契遊戲)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Font: Plus Jakarta Sans / Noto Sans TC -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #F0F9FF;
      color: #0F172A;
    }

    /* Notion 3D Solid Border Style Helper */
    .notion-box {
      background-color: #FFFFFF;
      border: 2.5px solid #0F172A;
      box-shadow: 4px 4px 0px 0px #0F172A;
      border-radius: 1rem;
      transition: all 0.15s ease-in-out;
    }

    .notion-btn {
      border: 2.5px solid #0F172A;
      box-shadow: 3px 3px 0px 0px #0F172A;
      font-weight: 700;
      border-radius: 0.75rem;
      transition: all 0.1s ease-in-out;
    }
    .notion-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0px 0px #0F172A;
    }
    .notion-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px 0px #0F172A;
    }

    /* 3D Card Flip CSS */
    .perspective-1000 {
      perspective: 1000px;
    }
    
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-style: preserve-3d;
    }

    .card-inner.flipped {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border: 2.5px solid #0F172A;
      border-radius: 1rem;
      box-shadow: 4px 4px 0px 0px #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card-back {
      transform: rotateY(180deg);
    }

    /* Wave effect background elements */
    .ocean-bg {
      background: radial-gradient(circle at 50% 0%, #E0F2FE 0%, #F0F9FF 70%);
    }

    /* Custom Pulse animation for status indicator */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-animation {
      animation: pulse-ring 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="ocean-bg min-h-screen flex flex-col justify-between p-4 sm:p-6 relative selection:bg-sky-200">

  <!-- Notification Toast Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm"></div>

  <!-- Header Section -->
  <header class="w-full max-w-4xl mx-auto flex justify-between items-center py-2">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-sky-500 rounded-xl border-2 border-slate-900 shadow-[2px_2px_0px_0px_#0F172A] flex items-center justify-center text-white font-extrabold text-xl">
        <i data-lucide="waves" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight flex items-center gap-2">
          雲端心電感應
          <span class="text-xs px-2 py-0.5 bg-sky-100 text-sky-800 rounded-full border border-sky-300 font-bold">多人默契</span>
        </h1>
        <p class="text-xs text-slate-500 font-bold">Ocean Telepathy Game</p>
      </div>
    </div>

    <!-- Right Actions / Hidden Host Secret Trigger -->
    <div class="flex items-center gap-2">
      <!-- Hidden Host Toggle Key Icon -->
      <button id="btn-toggle-host" onclick="toggleHostRole()" 
              title="隱藏房主切換 (Click to Toggle Host)" 
              class="p-2.5 bg-white text-slate-700 hover:text-amber-600 notion-btn flex items-center justify-center relative">
        <i data-lucide="key" class="w-5 h-5"></i>
        <span id="host-badge" class="hidden absolute -top-1.5 -right-1.5 w-3.5 h-3.5 bg-amber-500 border-2 border-slate-900 rounded-full"></span>
      </button>

      <!-- Room Info Tag (Visible inside room) -->
      <div id="room-info-tag" class="hidden flex items-center gap-2 bg-white px-3 py-1.5 rounded-xl border-2 border-slate-900 shadow-[2px_2px_0px_0px_#0F172A]">
        <i data-lucide="door-open" class="w-4 h-4 text-sky-600"></i>
        <span class="text-xs text-slate-500 font-bold">房號:</span>
        <span id="display-room-code" class="font-black text-sky-600 tracking-wider">----</span>
      </div>
    </div>
  </header>

  <!-- Main Dynamic Viewport -->
  <main class="w-full max-w-4xl mx-auto my-6 flex-1 flex flex-col justify-center">
    
    <!-- ==================== VIEW 1: LOGIN & ROOM SELECTION ==================== -->
    <div id="view-login" class="w-full max-w-md mx-auto notion-box p-6 sm:p-8 bg-white">
      <div class="text-center mb-6">
        <div class="inline-flex p-3 bg-sky-100 text-sky-600 rounded-2xl border-2 border-slate-900 shadow-[2px_2px_0px_0px_#0F172A] mb-3">
          <i data-lucide="radio" class="w-8 h-8"></i>
        </div>
        <h2 class="text-2xl font-black text-slate-900">進入默契頻道</h2>
        <p class="text-sm text-slate-500 font-medium mt-1">輸入暱稱與房間代碼開始挑戰</p>
      </div>

      <form id="form-login" onsubmit="handleJoinRoom(event)" class="space-y-4">
        <!-- Player Name -->
        <div>
          <label class="block text-xs font-black text-slate-700 uppercase tracking-wider mb-1">玩家名稱 (Player Name)</label>
          <div class="relative">
            <i data-lucide="user" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="input-player-name" required placeholder="例如: 派大星" 
                   class="w-full pl-10 pr-4 py-3 bg-slate-50 border-2 border-slate-900 rounded-xl font-bold text-slate-900 focus:outline-none focus:bg-white focus:ring-2 focus:ring-sky-400 transition-all">
          </div>
        </div>

        <!-- Room Code & Random Generator -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-black text-slate-700 uppercase tracking-wider">房間號碼 (Room Code)</label>
            <button type="button" onclick="generateRandomRoomCode()" class="text-xs font-bold text-sky-600 hover:text-sky-800 underline">
              隨機產生房號
            </button>
          </div>
          <div class="relative">
            <i data-lucide="hash" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="input-room-code" required placeholder="例如: 8888" maxlength="10"
                   class="w-full pl-10 pr-4 py-3 bg-slate-50 border-2 border-slate-900 rounded-xl font-black text-slate-900 tracking-wider uppercase focus:outline-none focus:bg-white focus:ring-2 focus:ring-sky-400 transition-all">
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="pt-2 flex flex-col gap-3">
          <button type="submit" class="w-full py-3.5 bg-sky-500 hover:bg-sky-400 text-white notion-btn flex items-center justify-center gap-2 text-base">
            <i data-lucide="log-in" class="w-5 h-5"></i>
            進入遊戲大廳
          </button>
        </div>
      </form>
    </div>

    <!-- ==================== VIEW 2: GAMEPLAY ROOM ==================== -->
    <div id="view-game" class="hidden w-full flex flex-col gap-6">

      <!-- Host Control Panel Box (Only shown if isHost = true) -->
      <div id="host-control-panel" class="hidden notion-box p-5 bg-gradient-to-r from-amber-50 to-orange-50 border-amber-900">
        <div class="flex items-center justify-between border-b-2 border-slate-900/10 pb-3 mb-4">
          <div class="flex items-center gap-2">
            <span class="p-1.5 bg-amber-400 text-slate-900 rounded-lg border border-slate-900">
              <i data-lucide="shield-alert" class="w-5 h-5"></i>
            </span>
            <h3 class="font-black text-slate-900 text-base">房主專用控制台</h3>
          </div>
          <span class="text-xs font-bold bg-amber-200 text-amber-900 px-2.5 py-1 rounded-md border border-amber-400">Hidden Host Active</span>
        </div>

        <!-- Setup Question Form (Host Status: Setup) -->
        <div id="host-setup-form" class="space-y-3">
          <label class="block text-xs font-black text-slate-700 uppercase">設定題目內容</label>
          <div class="flex flex-col sm:flex-row gap-2">
            <input type="text" id="input-host-question" placeholder="例如: 提到夏天第一個想到的食物是什麼？" 
                   class="flex-1 px-4 py-2.5 bg-white border-2 border-slate-900 rounded-xl font-bold text-slate-900 focus:outline-none">
            <button onclick="handleSetQuestion()" class="px-5 py-2.5 bg-amber-400 hover:bg-amber-300 text-slate-900 notion-btn whitespace-nowrap flex items-center justify-center gap-1.5">
              <i data-lucide="send" class="w-4 h-4"></i>
              發布題目
            </button>
          </div>
        </div>

        <!-- Playing / Reveal Controls (Host Status: Playing or Revealed) -->
        <div id="host-game-controls" class="hidden flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-2 text-sm font-bold text-slate-700">
            <i data-lucide="users" class="w-4 h-4 text-sky-600"></i>
            已回應玩家: <span id="host-submitted-count" class="text-sky-600 font-extrabold text-base">0</span> 人
          </div>

          <div class="flex items-center gap-2">
            <button id="btn-reveal" onclick="handleReveal()" class="px-5 py-2.5 bg-emerald-400 hover:bg-emerald-300 text-slate-900 notion-btn flex items-center gap-1.5">
              <i data-lucide="eye" class="w-4 h-4"></i>
              開牌 (Reveal)
            </button>
            <button onclick="handleResetRound()" class="px-4 py-2.5 bg-rose-400 hover:bg-rose-300 text-slate-900 notion-btn flex items-center gap-1.5">
              <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
              重置/下一局
            </button>
          </div>
        </div>
      </div>

      <!-- Question Banner Card -->
      <div class="notion-box p-6 bg-sky-500 text-white relative overflow-hidden">
        <div class="absolute -right-6 -bottom-6 text-sky-400/30 pointer-events-none">
          <i data-lucide="help-circle" class="w-40 h-40"></i>
        </div>
        
        <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div>
            <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-sky-900/40 rounded-full text-xs font-bold text-sky-100 mb-2 border border-sky-300/30">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span id="game-status-text">同步連線中...</span>
            </div>
            <h2 id="display-question" class="text-2xl sm:text-3xl font-black tracking-tight text-white drop-shadow-sm">
              等待房主出題中...
            </h2>
          </div>

          <!-- Current User Tag -->
          <div class="self-start md:self-auto flex items-center gap-2 bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700 backdrop-blur-sm">
            <i data-lucide="user-check" class="w-4 h-4 text-sky-400"></i>
            <span class="text-xs text-slate-300 font-bold">我:</span>
            <span id="display-player-name" class="font-extrabold text-white">---</span>
          </div>
        </div>
      </div>

      <!-- Player Input Area (Visible during 'playing' status) -->
      <div id="player-input-card" class="notion-box p-6 bg-white">
        <h3 class="text-base font-black text-slate-900 mb-3 flex items-center gap-2">
          <i data-lucide="pen-tool" class="w-5 h-5 text-sky-500"></i>
          請輸入您的心電感應答案
        </h3>
        <form onsubmit="handleSubmitAnswer(event)" class="flex flex-col sm:flex-row gap-3">
          <input type="text" id="input-player-answer" required placeholder="請寫下第一直覺的答案..." 
                 class="flex-1 px-4 py-3 bg-slate-50 border-2 border-slate-900 rounded-xl font-bold text-slate-900 focus:outline-none focus:bg-white focus:ring-2 focus:ring-sky-400">
          <button type="submit" id="btn-submit-answer" class="px-6 py-3 bg-sky-500 hover:bg-sky-400 text-white notion-btn flex items-center justify-center gap-2 whitespace-nowrap">
            <i data-lucide="send" class="w-4 h-4"></i>
            送出答案
          </button>
        </form>
        <p id="answer-submitted-tip" class="hidden text-xs font-bold text-emerald-600 mt-2 flex items-center gap-1">
          <i data-lucide="check-circle-2" class="w-4 h-4"></i> 答案已成功送出！在開牌前您仍可修改答案重新送出。
        </p>
      </div>

      <!-- Answers Grid Display Section -->
      <div>
        <div class="flex items-center justify-between mb-4 px-1">
          <h3 class="text-lg font-black text-slate-900 flex items-center gap-2">
            <i data-lucide="grid" class="w-5 h-5 text-sky-600"></i>
            全體卡片陣列
          </h3>
          <span id="card-count-badge" class="text-xs font-black bg-slate-200 text-slate-800 px-3 py-1 rounded-full border border-slate-800">
            0 人參與
          </span>
        </div>

        <!-- 3D Cards Grid -->
        <div id="cards-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 sm:gap-6">
          <!-- Empty State Placeholder -->
          <div class="col-span-full notion-box p-12 text-center bg-white/60">
            <i data-lucide="ghost" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
            <p class="font-black text-slate-400 text-sm">目前還沒有玩家加入或提交答案</p>
          </div>
        </div>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="w-full max-w-4xl mx-auto text-center py-4 text-xs font-bold text-slate-400 border-t border-slate-200 mt-auto">
    雲端心電感應 Telepathy Game &copy; Notion Style Ocean Theme
  </footer>

  <!-- Application Logic -->
  <script>
    // ================= CONFIG & GLOBALS =================
    const SHEET_NAME = 'TelepathyData';
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzETWwk5smlIU9gUAyBMZw_QpoD5UrhsgvXW65q7nZ_8iT1rWnKuqCi1RIo08yKskza/exec";

    let roomCode = "";
    let playerName = "";
    let isHost = false;
    let pollingTimer = null;
    let localGameState = {
      status: "setup",
      question: "",
      answers: {}
    };

    // ================= INITIALIZATION =================
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });

    // ================= TOAST NOTIFICATIONS =================
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const bgColors = {
        info: 'bg-slate-900 text-white',
        success: 'bg-emerald-500 text-white',
        error: 'bg-rose-500 text-white',
        warning: 'bg-amber-400 text-slate-900'
      };

      toast.className = `px-4 py-3 rounded-xl border-2 border-slate-900 shadow-[3px_3px_0px_0px_#0F172A] font-bold text-sm flex items-center gap-2 transform transition-all duration-300 translate-x-8 opacity-0 ${bgColors[type] || bgColors.info}`;
      toast.innerHTML = `<span>${message}</span>`;

      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-x-8', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-x-8');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // ================= HELPER FUNCTIONS =================
    function generateRandomRoomCode() {
      const code = Math.floor(1000 + Math.random() * 9000).toString();
      document.getElementById('input-room-code').value = code;
      showToast(`已產生隨機房間號碼: ${code}`, 'info');
    }

    function toggleHostRole() {
      isHost = !isHost;
      const hostBadge = document.getElementById('host-badge');
      const hostPanel = document.getElementById('host-control-panel');

      if (isHost) {
        hostBadge.classList.remove('hidden');
        showToast("切換為【房主權限】", "warning");
      } else {
        hostBadge.classList.add('hidden');
        showToast("切換為【一般玩家權限】", "info");
      }

      // Update UI components if inside game room
      if (roomCode) {
        renderUI();
      }
    }

    // ================= ROOM LOGIN & NETWORK =================
    function handleJoinRoom(e) {
      e.preventDefault();
      const pName = document.getElementById('input-player-name').value.trim();
      const rCode = document.getElementById('input-room-code').value.trim().toUpperCase();

      if (!pName || !rCode) {
        showToast("請填寫玩家名稱與房間號碼", "error");
        return;
      }

      playerName = pName;
      roomCode = rCode;

      // Update Header Info
      document.getElementById('display-room-code').innerText = roomCode;
      document.getElementById('display-player-name').innerText = playerName;
      document.getElementById('room-info-tag').classList.remove('hidden');

      // Switch Views
      document.getElementById('view-login').classList.add('hidden');
      document.getElementById('view-game').classList.remove('hidden');

      showToast(`成功進入房間 [${roomCode}]`, "success");

      // Start Polling
      fetchRoomState();
      startPolling();
    }

    function startPolling() {
      if (pollingTimer) clearInterval(pollingTimer);
      pollingTimer = setInterval(fetchRoomState, 2000);
    }

    // GET Request to GAS API
    async function fetchRoomState() {
      if (!roomCode) return;
      try {
        const response = await fetch(`${GAS_API_URL}?room=${encodeURIComponent(roomCode)}`);
        if (!response.ok) throw new Error('Network response error');
        
        const data = await response.json();
        
        // Update local state and trigger UI render
        localGameState.status = data.status || "setup";
        localGameState.question = data.question || "";
        localGameState.answers = data.answers || {};

        renderUI();
      } catch (err) {
        console.error("Polling fetch error:", err);
      }
    }

    // POST Request Helper to GAS API
    async function postGASAction(payload) {
      payload.room = roomCode;
      try {
        // Standard text/plain payload to avoid CORS preflight issues with GAS
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        // Immediately trigger polling sync after action
        fetchRoomState();
        return result;
      } catch (err) {
        console.error("GAS Post Action Error:", err);
        showToast("連線發生錯誤，請重試", "error");
      }
    }

    // ================= HOST ACTIONS =================
    async function handleSetQuestion() {
      const qText = document.getElementById('input-host-question').value.trim();
      if (!qText) {
        showToast("請輸入題目內容", "warning");
        return;
      }
      showToast("正在發布題目...", "info");
      await postGASAction({
        action: "set_question",
        question: qText
      });
      document.getElementById('input-host-question').value = "";
      showToast("題目已發布！", "success");
    }

    async function handleReveal() {
      showToast("發送開牌指令...", "info");
      await postGASAction({ action: "reveal" });
    }

    async function handleResetRound() {
      if (!confirm("確定要重置題目並進行下一局嗎？")) return;
      showToast("正在重置房間...", "info");
      await postGASAction({ action: "reset" });
    }

    // ================= PLAYER ACTIONS =================
    async function handleSubmitAnswer(e) {
      e.preventDefault();
      const ansText = document.getElementById('input-player-answer').value.trim();
      if (!ansText) {
        showToast("請輸入答案內容", "warning");
        return;
      }

      showToast("答案送出中...", "info");
      await postGASAction({
        action: "submit_answer",
        playerName: playerName,
        answer: ansText
      });
      
      showToast("答案已成功提交！", "success");
    }

    // ================= UI RENDER ENGINE =================
    function renderUI() {
      const { status, question, answers } = localGameState;

      // 1. Host Panel Visibility
      const hostPanel = document.getElementById('host-control-panel');
      const hostSetupForm = document.getElementById('host-setup-form');
      const hostGameControls = document.getElementById('host-game-controls');

      if (isHost) {
        hostPanel.classList.remove('hidden');
        if (status === 'setup') {
          hostSetupForm.classList.remove('hidden');
          hostGameControls.classList.add('hidden');
        } else {
          hostSetupForm.classList.add('hidden');
          hostGameControls.classList.remove('hidden');
          document.getElementById('host-submitted-count').innerText = Object.keys(answers).length;
        }
      } else {
        hostPanel.classList.add('hidden');
      }

      // 2. Question & Status Display
      const questionEl = document.getElementById('display-question');
      const statusTextEl = document.getElementById('game-status-text');

      if (status === 'setup') {
        questionEl.innerText = "等待房主出題中...";
        statusTextEl.innerText = "出題階段";
      } else {
        questionEl.innerText = question || "題目載入中...";
        statusTextEl.innerText = status === 'playing' ? "作答進行中" : "已開牌！";
      }

      // 3. Player Answer Input Card Visibility
      const playerInputCard = document.getElementById('player-input-card');
      const answerSubmittedTip = document.getElementById('answer-submitted-tip');
      
      if (status === 'playing') {
        playerInputCard.classList.remove('hidden');
        if (answers[playerName]) {
          answerSubmittedTip.classList.remove('hidden');
          // Update placeholder/value to current submitted
          const inputAns = document.getElementById('input-player-answer');
          if (document.activeElement !== inputAns && !inputAns.value) {
            inputAns.value = answers[playerName];
          }
        } else {
          answerSubmittedTip.classList.add('hidden');
        }
      } else {
        playerInputCard.classList.add('hidden');
      }

      // 4. Render 3D Cards Grid
      renderCardsGrid(answers, status);
    }

    function renderCardsGrid(answers, status) {
      const grid = document.getElementById('cards-grid');
      const playerNames = Object.keys(answers);
      
      document.getElementById('card-count-badge').innerText = `${playerNames.length} 人參與`;

      if (playerNames.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full notion-box p-12 text-center bg-white/60">
            <i data-lucide="ghost" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
            <p class="font-black text-slate-400 text-sm">目前還沒有玩家加入或提交答案</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const isFlipped = (status === 'revealed');

      grid.innerHTML = playerNames.map(name => {
        const answerVal = answers[name] || "";
        const isSelf = (name === playerName);

        return `
          <div class="h-36 sm:h-44 perspective-1000 w-full">
            <div class="card-inner ${isFlipped ? 'flipped' : ''}">
              
              <!-- Card Front (Player Name) -->
              <div class="card-front ${isSelf ? 'bg-sky-100 border-sky-600' : 'bg-white'}">
                <div class="w-10 h-10 rounded-full ${isSelf ? 'bg-sky-500 text-white' : 'bg-slate-100 text-slate-700'} border-2 border-slate-900 flex items-center justify-center font-black mb-2 shadow-[2px_2px_0px_0px_#0F172A]">
                  ${name.charAt(0).toUpperCase()}
                </div>
                <div class="font-black text-slate-900 text-base truncate max-w-full px-2">${name}</div>
                <div class="text-xs font-bold ${isFlipped ? 'text-emerald-600' : 'text-slate-400'} mt-1 flex items-center gap-1">
                  ${isFlipped ? '<i data-lucide="check" class="w-3 h-3"></i> 已揭曉' : '<i data-lucide="lock" class="w-3 h-3"></i> 已準備'}
                </div>
              </div>

              <!-- Card Back (Submitted Answer) -->
              <div class="card-back ${isSelf ? 'bg-amber-100 border-amber-600' : 'bg-sky-50 border-sky-400'}">
                <span class="text-[10px] font-black uppercase text-slate-400 mb-1">${name} 的答案</span>
                <p class="text-lg sm:text-xl font-black text-slate-900 break-words px-2 max-h-24 overflow-y-auto leading-tight">
                  "${answerVal}"
                </p>
              </div>

            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }
  </script>
</body>
</html>
